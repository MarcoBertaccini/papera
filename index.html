<style>
  :root {
    --pond: #0e3a43;
    --pond-deep: #092830;
    --sun: #ffd23f;
    --beak: #ff7a1a;
    --foam: #e8f4f2;
    --ripple: rgba(232, 244, 242, .25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: radial-gradient(120% 90% at 50% 10%, var(--pond) 0%, var(--pond-deep) 75%);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    color: var(--foam);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  h1 {
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    font-weight: 600;
    letter-spacing: .35em;
    text-transform: lowercase;
    opacity: .55;
  }

  .stage {
    position: relative;
    width: min(70vw, 340px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
  }

  button.duck {
    all: unset;
    cursor: pointer;
    width: 100%;
    display: block;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,.35));
    transition: transform .12s cubic-bezier(.34,1.56,.64,1);
  }
  button.duck:active { transform: scale(.92); }
  button.duck:focus-visible {
    outline: 3px solid var(--sun);
    outline-offset: 12px;
    border-radius: 50%;
  }

  .duck svg { width: 100%; height: auto; display: block; }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50%      { transform: translateY(-10px) rotate(1.5deg); }
  }
  .floaty { animation: bob 3.2s ease-in-out infinite; }

  @keyframes quackJump {
    0%   { transform: translateY(0) scale(1); }
    30%  { transform: translateY(-26px) scale(1.06, .94); }
    60%  { transform: translateY(0) scale(.96, 1.05); }
    100% { transform: translateY(0) scale(1); }
  }
  .quacking { animation: quackJump .45s cubic-bezier(.34,1.56,.64,1); }

  .ripple {
    position: absolute;
    inset: auto;
    bottom: 6%;
    width: 70%;
    height: 70%;
    border-radius: 50%;
    border: 2px solid var(--ripple);
    opacity: 0;
    pointer-events: none;
  }
  @keyframes rippleOut {
    from { transform: scale(.5); opacity: .8; }
    to   { transform: scale(1.6); opacity: 0; }
  }
  .ripple.go { animation: rippleOut .8s ease-out forwards; }

  .qua {
    position: absolute;
    font-weight: 800;
    font-size: 1.4rem;
    color: var(--sun);
    pointer-events: none;
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  @keyframes quaFly {
    from { transform: translateY(0) rotate(var(--tilt)); opacity: 1; }
    to   { transform: translateY(-90px) rotate(var(--tilt)); opacity: 0; }
  }
  .qua { animation: quaFly 1s ease-out forwards; }

  .counter {
    font-variant-numeric: tabular-nums;
    text-align: center;
    line-height: 1.6;
    min-height: 3.4rem;
  }
  .counter strong {
    display: block;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    color: var(--sun);
  }
  .counter span { font-size: .9rem; opacity: .65; }

  footer {
    position: fixed;
    bottom: 1rem;
    font-size: .75rem;
    letter-spacing: .08em;
    opacity: .35;
  }
  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    .floaty, .quacking, .ripple.go, .qua { animation: none; }
  }
</style>
</head>

      const bin = atob(QUACK_B64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      ctx.decodeAudioData(bytes.buffer, b => { quackBuf = b; }, () => {});
    }
  }

  const milestones = [
    [1,   'qua.'],
    [10,  'dieci qua. rispetto.'],
    [25,  'la papera inizia a fidarsi.'],
    [50,  'cinquanta. hai altro da fare, vero?'],
    [100, 'cento qua. sei ufficialmente nel team papera.'],
    [250, 'la papera ora risponde solo a te.'],
    [500, 'cinquecento. chiamiamo qualcuno?'],
    [1000,'mille qua. la papera ti nomina suo erede.']
  ];

  function quackSound() {
    initAudio();
    if (!quackBuf) return; // still decoding on the very first click; ready by the next
    const src = ctx.createBufferSource();
    src.buffer = quackBuf;
    src.playbackRate.value = 0.9 + Math.random() * 0.2; // each qua slightly different
    const gain = ctx.createGain();
    gain.gain.value = 0.9;
    src.connect(gain).connect(ctx.destination);
    src.start();
  }

  function spawnQua() {
    const q = document.createElement('div');
    q.className = 'qua';
    q.textContent = 'QUA';
    q.style.left = (35 + Math.random() * 30) + '%';
    q.style.top = (10 + Math.random() * 20) + '%';
    q.style.setProperty('--tilt', (Math.random() * 30 - 15) + 'deg');
    stage.appendChild(q);
    setTimeout(() => q.remove(), 1000);
  }

  function updateMsg() {
    for (let i = milestones.length - 1; i >= 0; i--) {
      if (count >= milestones[i][0]) { msgEl.textContent = milestones[i][1]; return; }
    }
  }

  duck.addEventListener('pointerdown', initAudio, { once: true });

  duck.addEventListener('click', () => {
    count++;
    countEl.textContent = count;
    updateMsg();
    quackSound();
    spawnQua();

    floaty.classList.remove('quacking');
    void floaty.offsetWidth; // restart animation
    floaty.classList.add('quacking');

    ripple.classList.remove('go');
    void ripple.offsetWidth;
    ripple.classList.add('go');

    document.title = count % 2 ? 'QUA!' : 'papera.';
  });
})();
</script>

</body>
</html>
